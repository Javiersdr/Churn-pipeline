name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure dlt credentials and dbt profile for CI
        run: |
          cp -r .dlt.example .dlt
          # Override endpoint to localhost because MinIO runs directly on the runner
          sed -i 's/endpoint_url = "http:\/\/minio:9000"/endpoint_url = "http:\/\/localhost:9000"/' .dlt/config.toml

          # Create a dbt profile for CI (MinIO on localhost)
          mkdir -p dbt_churn/docker
          cat > dbt_churn/docker/profiles.yml << 'EOF'
          telco_churn:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: ../data/churn_data.duckdb
                schema: main
                extensions:
                  - httpfs
                settings:
                  s3_region: us-east-1
                  s3_endpoint: localhost:9000
                  s3_url_style: path
                  s3_access_key_id: admin
                  s3_secret_access_key: password
                  s3_use_ssl: false
          EOF

      - name: Build Docker images
        run: docker compose build

      - name: Run CI pipeline
        run: make ci-pipeline