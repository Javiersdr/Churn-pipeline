name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make docker-compose available in CI
        run: |
          echo 'docker compose "$@"' > /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

      - name: Configure dlt credentials and dbt profile for CI
        run: |
          cp -r .dlt.example .dlt

          # dbt profile for CI
          mkdir -p dbt_churn/docker
          cat > dbt_churn/docker/profiles.yml << 'EOF'
          telco_churn:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: ../data/churn_data.duckdb
                schema: main
                extensions:
                  - httpfs
                settings:
                  s3_region: us-east-1
                  s3_endpoint: minio:9000
                  s3_url_style: path
                  s3_access_key_id: admin
                  s3_secret_access_key: password
                  s3_use_ssl: false
          EOF

      - name: Create .env file for Docker Compose
        run: |
          cat > .env << EOF
          MINIO_ROOT_USER=admin
          MINIO_ROOT_PASSWORD=password
          POSTGRES_USER=airflow
          POSTGRES_PASSWORD=airflow
          S3_ACCESS_KEY=admin
          S3_SECRET_KEY=password
          EOF

      - name: Build Docker images
        run: docker compose build

      - name: Wait for MinIO
        run: |
          docker compose up -d minio
          timeout 60 bash -c 'while ! docker compose exec minio curl -f http://localhost:9000/minio/health/live; do sleep 2; done'

      - name: Run CI pipeline
        run: make ci-pipeline

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check .