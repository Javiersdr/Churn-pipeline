name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make docker-compose available in CI
        run: |
          echo 'docker compose "$@"' > /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

      - name: Configure dlt credentials and dbt profile for CI
        run: |
          cp -r .dlt.example .dlt
          # No cambiamos el endpoint, usa minio:9000 tal como está en .dlt.example

          # Crear un dbt profile para CI (MinIO en el servicio minio)
          mkdir -p dbt_churn/docker
          cat > dbt_churn/docker/profiles.yml << 'EOF'
          telco_churn:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: ../data/churn_data.duckdb
                schema: main
                extensions:
                  - httpfs
                settings:
                  s3_region: us-east-1
                  s3_endpoint: minio:9000
                  s3_url_style: path
                  s3_access_key_id: admin
                  s3_secret_access_key: password
                  s3_use_ssl: false
          EOF

      - name: Build Docker images
        run: docker compose build

      - name: Wait for MinIO to be healthy
        run: |
          docker compose up -d minio
          timeout 60 bash -c 'while ! docker compose exec minio curl -f http://localhost:9000/minio/health/live; do sleep 2; done'

      - name: Run CI pipeline
        run: make ci-pipeline