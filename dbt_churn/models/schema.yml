version: 2
models:
  - name: stg_telco__customers
    description: "Clean Telco client data"
    columns:
      - name: customer_id
        description: "Primary key"
        data_tests:
          - not_null
          - unique

      - name: tenure
        description: "Months of subscription"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: monthly_charges
        description: "Monthly charge"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:  
                min_value: 0
              # max_value: 1000

  - name: int_churn_features
    description: "Intermediate model with business logic and churn flag"
    columns:
      - name: churn
        description: "Boolean flag indicating if customer churned"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Yes', 'No']