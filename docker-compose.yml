# =============================================================================
# Proyecto: Churn Pipeline – Local environment
# Servicios: dbt (dev), Airflow (orchestration), Postgres (Airflow metadata)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 1. Dbt
  # ---------------------------------------------------------------------------
  dbt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn_dbt
    #entrypoint: ["sleep", "infinity"]
    entrypoint: /bin/bash
    image: churn_dbt:latest
    volumes:
      - .:/app
      - ~/.dbt:/root/.dbt
    environment:
      - DBT_PROFILES_DIR=/app/dbt_churn
      - DBT_TARGET_PATH=target_dev
    working_dir: /app/dbt_churn
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # 2. Postgres
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:13
    container_name: churn_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # 3. Airflow initialization (DB and admin creation)
  # ---------------------------------------------------------------------------
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: churn_airflow_init
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - DBT_TARGET_PATH=target_airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/dbt_project
    entrypoint: >
      /bin/bash -c "
      airflow db init &&
      airflow users create --username admin --firstname Admin --lastname User --email admin@example.com --role Admin --password admin
      "
    restart: "no"

  # ---------------------------------------------------------------------------
  # 4. Airflow Webserver (http://localhost:8080)
  # ---------------------------------------------------------------------------
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: churn_airflow_webserver
    depends_on:
      - airflow-init
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - DBT_TARGET_PATH=target_airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/dbt_project
      - ./logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: webserver
    restart: always

  # ---------------------------------------------------------------------------
  # 5. Airflow Scheduler (to run the DAGs)
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: churn_airflow_scheduler
    depends_on:
      - airflow-init
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - DBT_TARGET_PATH=target_airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/dbt_project
      - ./logs:/opt/airflow/logs
    command: scheduler
    restart: always

# =============================================================================
# Persistent volumes
# =============================================================================
volumes:
  postgres_data: