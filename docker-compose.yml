services:

  # ==========================================================================
  # 1. MinIO – Data Lake local (S3 compatible)
  # ==========================================================================
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # 2. Postgres – Airflow metadata database
  # ==========================================================================
  postgres:
    image: postgres:16
    container_name: churn_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # 3. Airflow initialization (DB and admin creation)
  # ==========================================================================
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: churn_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      - DBT_TARGET_PATH=target_airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/dbt_project
    entrypoint: >
      /bin/bash -c "
      airflow db init &&
      airflow users create --username admin --firstname Admin --lastname User --email admin@example.com --role Admin --password admin
      "
    restart: "no"

  # ==========================================================================
  # 4. Airflow Webserver (http://localhost:8080)
  # ==========================================================================
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: churn_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      - DBT_TARGET_PATH=target_airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/dbt_project
      - ./logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: webserver
    restart: always

  # ==========================================================================
  # 5. Airflow Scheduler (to run the DAGs)
  # ==========================================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: churn_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      - DBT_TARGET_PATH=target_airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/dbt_project
      - ./logs:/opt/airflow/logs
    command: scheduler
    restart: always

  # ==========================================================================
  # 6. Dbt development container (optional, for manual runs)
  # ==========================================================================
  dbt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn_dbt
    image: churn_dbt:latest
    entrypoint: /bin/bash
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - ~/.dbt:/root/.dbt
    environment:
      - DBT_PROFILES_DIR=/app/dbt_churn
      - DBT_TARGET_PATH=target_dev
    working_dir: /app/dbt_churn
    depends_on:
      minio:
        condition: service_healthy

  # ==========================================================================
  # 7. Streamlit Dashboard (http://localhost:8501)
  # ==========================================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn_dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - minio
    restart: always

volumes:
  postgres_data:
  minio_data: